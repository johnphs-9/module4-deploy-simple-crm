# Stretch Option 1: CI pipeline to Docker Hub
# Builds, tests and publishes the Simple CRM API image on every push to main.
# Runs side by side with the Render deployment pipeline (which builds from the Dockerfile on push).
# Docker Hub credentials are provided as repository secrets — never committed to code.

name: build_test_publish

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & test (H2 in-memory database — no external DB needed in CI)
  # ---------------------------------------------------------------------------
  test:
    name: Build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies and build
        working-directory: simple-crm-api
        run: |
          echo "Building the application..."
          ./mvnw -B clean install
          echo "Build completed."
          echo "Saving JAR for the publish job..."

      - name: Save JAR for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: simple-crm-api/target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Build image & push to Docker Hub (only if tests pass)
  # ---------------------------------------------------------------------------
  publish:
    name: Build_and_publish_to_Docker_Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: simple-crm-api
          push: true
          tags: |
            johnphs9/module4-deploy-simple-crm:latest
            johnphs9/module4-deploy-simple-crm:g${{ steps.sha.outputs.short }}
