# Stretch Option 1 + Stretch Option 4: CI pipeline to Docker Hub with SemVer + SHA tags
# Builds, tests and publishes the Simple CRM API image on every push to main.
# Tags published: latest (newest passing build), <MAJOR.MINOR.PATCH> (from VERSION file),
# and sha-<short-SHA> (immutable per-commit build, for traceability/rollback).
# Runs side by side with the Render deployment pipeline (which builds from the Dockerfile on push).
# Docker Hub credentials are provided as repository secrets — never committed to code.

name: build_test_publish

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & test (H2 in-memory database — no external DB needed in CI)
  # ---------------------------------------------------------------------------
  test:
    name: Build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies and build
        working-directory: simple-crm-api
        run: |
          echo "Building the application..."
          ./mvnw -B clean install
          echo "Build completed."
          echo "Saving JAR for the publish job..."

      - name: Save JAR for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: simple-crm-api/target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Build image & push to Docker Hub (only if tests pass)
  # ---------------------------------------------------------------------------
  publish:
    name: Build_and_publish_to_Docker_Hub
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Stretch Option 4: read the semantic version from the VERSION file at repo root.
      # Fails the build if the file is missing or not MAJOR.MINOR.PATCH (Lesson 4.5).
      - name: Read semantic version (VERSION file)
        id: ver
        working-directory: .
        run: |
          VER=$(sed -n 's/^\s*\([0-9]\+\.[0-9]\+\.[0-9]\+\)\s*$/\1/p' VERSION | head -1)
          if [ -z "$VER" ]; then
            echo "::error::VERSION file missing or not MAJOR.MINOR.PATCH — refusing to publish an unversioned image."
            exit 1
          fi
          echo "semver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Publishing image version ${VER}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish commit image
        uses: docker/build-push-action@v6
        with:
          context: simple-crm-api
          push: true
          tags: johnphs9/module4-deploy-simple-crm:sha-${{ steps.sha.outputs.short }}

      # The publish lock prevents two runs from moving tags at the same time.
      # Skip moving tags when a newer commit has already reached main.
      - name: Check current main and release version
        id: release
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Current commit is no longer the tip of main; leaving moving tags alone."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          # A version tag is created only when VERSION changed in this commit.
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish latest image
        if: steps.release.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: simple-crm-api
          push: true
          tags: johnphs9/module4-deploy-simple-crm:latest

      - name: Publish release version
        if: steps.release.outputs.current == 'true' && steps.release.outputs.version_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: simple-crm-api
          push: true
          tags: johnphs9/module4-deploy-simple-crm:${{ steps.ver.outputs.semver }}
