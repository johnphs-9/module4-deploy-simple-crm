services:
  db:
    image: postgres:17-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      POSTGRES_DB: simple_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"      # using default host port 5432  

  api:
    build: .
    image: m4-deploy-simple-crm-api:1.0.0
    restart: unless-stopped   # retries while Postgres is still starting up
    depends_on:
      db:
        condition: service_healthy
    env_file: .env       # supplies APP_JWT_SECRET, APP_USER_*, APP_ADMIN_*, APP_MANAGER_*
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/simple_crm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
