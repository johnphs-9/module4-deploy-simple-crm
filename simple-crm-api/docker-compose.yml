services:
  # ========================================
  # PostgreSQL Database Container
  # ========================================
  db:
    image: postgres:17-alpine
    container_name: simple-crm-db
    volumes:
      - simple_crm-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: simple_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ========================================
  # Spring Boot Application Container
  # ========================================
  api:
    build: 
      context: .
    image: m4-deploy-simple-crm-api:1.0.4
    container_name: m4-deploy-simple-crm-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/simple_crm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    env_file: .env       # supplies APP_JWT_SECRET, APP_USER_*, APP_ADMIN_*, APP_MANAGER_*
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped   # retries while Postgres is still starting up

# ========================================
# Volumes (Persistent Storage)
# ========================================
volumes:
  simple_crm-data: